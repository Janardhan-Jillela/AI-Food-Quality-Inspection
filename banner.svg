<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1D19"/>
      <stop offset="45%" stop-color="#102A24"/>
      <stop offset="100%" stop-color="#0A1814"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16A34A"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#13342D" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0E241F" stop-opacity="0.85"/>
    </linearGradient>
    <!-- Radial Glows -->
    <radialGradient id="centerGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#16A34A" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#102A24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cornerGlow" cx="95%" cy="15%" r="40%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#102A24" stop-opacity="0"/>
    </radialGradient>
    <!-- Filter for soft glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="20" fill="url(#bgGradient)"/>
  <rect width="1200" height="340" rx="20" fill="url(#centerGlow)"/>
  <rect width="1200" height="340" rx="20" fill="url(#cornerGlow)"/>

  <!-- Border Frame -->
  <rect x="1.5" y="1.5" width="1197" height="337" rx="18.5" fill="none" stroke="#16A34A" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- Tech Grid Accents -->
  <g opacity="0.08" stroke="#34D399" stroke-width="1">
    <line x1="120" y1="0" x2="120" y2="340"/>
    <line x1="240" y1="0" x2="240" y2="340"/>
    <line x1="960" y1="0" x2="960" y2="340"/>
    <line x1="1080" y1="0" x2="1080" y2="340"/>
    <line x1="0" y1="85" x2="1200" y2="85"/>
    <line x1="0" y1="255" x2="1200" y2="255"/>
  </g>

  <!-- Corner Tech Geometry -->
  <g stroke="#34D399" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 30,55 L 30,30 L 55,30"/>
    <path d="M 1170,55 L 1170,30 L 1145,30"/>
    <path d="M 30,285 L 30,310 L 55,310"/>
    <path d="M 1170,285 L 1170,310 L 1145,310"/>
  </g>

  <!-- Left AI Scanner Graphic -->
  <g transform="translate(65, 85)" opacity="0.9">
    <rect x="0" y="0" width="140" height="140" rx="16" fill="url(#cardGrad)" stroke="#16A34A" stroke-width="1.5"/>
    <!-- Outer Target Marks -->
    <path d="M 15,35 L 15,15 L 35,15" stroke="#34D399" stroke-width="2.5" fill="none"/>
    <path d="M 125,35 L 125,15 L 105,15" stroke="#34D399" stroke-width="2.5" fill="none"/>
    <path d="M 15,105 L 15,125 L 35,125" stroke="#34D399" stroke-width="2.5" fill="none"/>
    <path d="M 125,105 L 125,125 L 105,125" stroke="#34D399" stroke-width="2.5" fill="none"/>
    <!-- Scanning Apple / Leaf Silhouette -->
    <path d="M 70,45 C 55,45 42,56 42,76 C 42,100 60,118 70,120 C 80,118 98,100 98,76 C 98,56 85,45 70,45 Z" fill="#16A34A" fill-opacity="0.3" stroke="#34D399" stroke-width="2"/>
    <path d="M 70,45 C 70,35 78,28 85,26 C 85,35 77,42 70,45 Z" fill="#34D399"/>
    <!-- Scan Laser Line -->
    <line x1="20" y1="80" x2="120" y2="80" stroke="#34D399" stroke-width="2" filter="url(#glow)"/>
    <circle cx="70" cy="80" r="3.5" fill="#FAFAF0"/>
  </g>

  <!-- Right Neural Flow Graphic -->
  <g transform="translate(995, 85)" opacity="0.9">
    <rect x="0" y="0" width="140" height="140" rx="16" fill="url(#cardGrad)" stroke="#16A34A" stroke-width="1.5"/>
    <!-- Neural Nodes -->
    <circle cx="35" cy="40" r="6" fill="#34D399"/>
    <circle cx="35" cy="70" r="6" fill="#16A34A"/>
    <circle cx="35" cy="100" r="6" fill="#34D399"/>
    <circle cx="70" cy="55" r="7" fill="#FAFAF0"/>
    <circle cx="70" cy="85" r="7" fill="#34D399"/>
    <circle cx="105" cy="70" r="8" fill="#22C55E"/>
    <!-- Synaptic Connections -->
    <line x1="35" y1="40" x2="70" y2="55" stroke="#34D399" stroke-width="1.5" stroke-opacity="0.6"/>
    <line x1="35" y1="70" x2="70" y2="55" stroke="#34D399" stroke-width="1.5" stroke-opacity="0.6"/>
    <line x1="35" y1="70" x2="70" y2="85" stroke="#34D399" stroke-width="1.5" stroke-opacity="0.6"/>
    <line x1="35" y1="100" x2="70" y2="85" stroke="#34D399" stroke-width="1.5" stroke-opacity="0.6"/>
    <line x1="70" y1="55" x2="105" y2="70" stroke="#22C55E" stroke-width="2" stroke-opacity="0.8"/>
    <line x1="70" y1="85" x2="105" y2="70" stroke="#22C55E" stroke-width="2" stroke-opacity="0.8"/>
    <!-- Pulse Effect -->
    <circle cx="105" cy="70" r="14" fill="none" stroke="#22C55E" stroke-width="1.5" stroke-opacity="0.4"/>
  </g>

  <!-- Central Typography -->
  <g text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    
    <!-- Category Badge -->
    <g transform="translate(600, 52)">
      <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#13342D" stroke="#34D399" stroke-width="1.2"/>
      <circle cx="-116" cy="0" r="4.5" fill="#22C55E"/>
      <text x="6" y="4.5" font-size="11.5" font-weight="700" fill="#34D399" letter-spacing="1.5">ENTERPRISE AGRI-VISION AI</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="115" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
      AI Food Quality Inspection System
    </text>

    <!-- Subtitle / Value Statement -->
    <text x="600" y="152" font-size="16" font-weight="600" fill="#34D399" letter-spacing="0.2">
      Automated Defect Localization <tspan fill="#FAFAF0" font-weight="400">•</tspan> 7-Tier Freshness Grading <tspan fill="#FAFAF0" font-weight="400">•</tspan> Degradation Forecasting
    </text>

    <text x="600" y="180" font-size="13.5" font-weight="400" fill="#FAFAF0" fill-opacity="0.82">
      Multi-Stage Pipeline Powered by YOLOv8/v9, ResNet-50, MobileNetV2, and Bi-LSTM
    </text>

    <!-- Bottom Metric Pills -->
    <g transform="translate(600, 245)">
      <!-- Pill 1: Test Accuracy -->
      <g transform="translate(-320, 0)">
        <rect x="-85" y="-22" width="170" height="44" rx="10" fill="#13342D" stroke="#16A34A" stroke-width="1.2"/>
        <text x="0" y="-4" font-size="11" font-weight="600" fill="#34D399" letter-spacing="0.5">TEST ACCURACY</text>
        <text x="0" y="15" font-size="17" font-weight="800" fill="#FFFFFF">94.48%</text>
      </g>

      <!-- Pill 2: Validation Accuracy -->
      <g transform="translate(-105, 0)">
        <rect x="-85" y="-22" width="170" height="44" rx="10" fill="#13342D" stroke="#16A34A" stroke-width="1.2"/>
        <text x="0" y="-4" font-size="11" font-weight="600" fill="#34D399" letter-spacing="0.5">PEAK VAL ACCURACY</text>
        <text x="0" y="15" font-size="17" font-weight="800" fill="#22C55E">96.19%</text>
      </g>

      <!-- Pill 3: Macro F1-Score -->
      <g transform="translate(105, 0)">
        <rect x="-85" y="-22" width="170" height="44" rx="10" fill="#13342D" stroke="#16A34A" stroke-width="1.2"/>
        <text x="0" y="-4" font-size="11" font-weight="600" fill="#34D399" letter-spacing="0.5">MACRO F1-SCORE</text>
        <text x="0" y="15" font-size="17" font-weight="800" fill="#FFFFFF">95.24%</text>
      </g>

      <!-- Pill 4: Taxonomy Scope -->
      <g transform="translate(320, 0)">
        <rect x="-85" y="-22" width="170" height="44" rx="10" fill="#13342D" stroke="#16A34A" stroke-width="1.2"/>
        <text x="0" y="-4" font-size="11" font-weight="600" fill="#34D399" letter-spacing="0.5">PRODUCE TAXONOMY</text>
        <text x="0" y="15" font-size="17" font-weight="800" fill="#34D399">36 Species</text>
      </g>
    </g>

  </g>
</svg>
